name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    env:
      # Architectures shipped in the APKs and the AAB. 32-bit x86 is not built.
      ABIS: armeabi-v7a,arm64-v8a,x86_64
      SPLIT_ABIS: armeabi-v7a arm64-v8a x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default "tools" package no longer exists in the SDK repository.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build universal APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures="$ABIS"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk \
            "../dist/KomaYomi-mobile-${{ steps.version.outputs.version }}-android-universal.apk"

      - name: Build per-ABI APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x android/gradlew
          for ABI in $SPLIT_ABIS; do
            (cd android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures="$ABI")
            cp android/app/build/outputs/apk/release/app-release.apk \
              "dist/KomaYomi-mobile-${VERSION}-android-${ABI}.apk"
          done

      - name: Build AAB for store upload
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd android && ./gradlew :app:bundleRelease --no-daemon -PreactNativeArchitectures="$ABIS")
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "dist/KomaYomi-mobile-${VERSION}-android.aab"

      - name: List artifacts and sizes
        run: ls -lh dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KomaYomi-mobile-${{ steps.version.outputs.version }}-android
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          size() { du -h "dist/$1" | cut -f1; }
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SIZE_UNIVERSAL__/$(size "KomaYomi-mobile-${VERSION}-android-universal.apk")/g" \
            -e "s/__SIZE_ARM64__/$(size "KomaYomi-mobile-${VERSION}-android-arm64-v8a.apk")/g" \
            -e "s/__SIZE_ARMV7__/$(size "KomaYomi-mobile-${VERSION}-android-armeabi-v7a.apk")/g" \
            -e "s/__SIZE_X86_64__/$(size "KomaYomi-mobile-${VERSION}-android-x86_64.apk")/g" \
            -e "s/__SIZE_AAB__/$(size "KomaYomi-mobile-${VERSION}-android.aab")/g" \
            .github/release-notes.md > "${RUNNER_TEMP}/release-notes.md"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --title "KomaYomi Mobile ${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "KomaYomi Mobile ${VERSION}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
